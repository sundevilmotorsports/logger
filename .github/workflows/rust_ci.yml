name: Continuous Integration

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: build
            args: --release
          - command: fmt
            args: --all -- --check --color always
          - command: clippy
            args: --all-targets --all-features --workspace -- -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install ESP-IDF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git wget flex bison gperf cmake ninja-build ccache \
            libffi-dev libssl-dev dfu-util libusb-1.0-0 python3-venv
      - name: Setup Rust
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add --toolchain nightly riscv32imc-unknown-none-elf riscv32imac-unknown-none-elf riscv32imafc-unknown-none-elf
          cargo install ldproxy
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: |
            .embuild
          key: esp-idf-${{ runner.os }}-${{ hashFiles('.cargo/config.toml', 'sdkconfig.defaults', 'components_esp32p4.lock') }}
          restore-keys: |
            esp-idf-${{ runner.os }}-
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}
